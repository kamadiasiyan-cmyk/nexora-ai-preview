name: Publish WatchTower frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'watchlist-utils.js'
      - 'shopping-api/**'
      - '.github/workflows/publish-watchtower.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchtower-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline regression tests
        working-directory: shopping-api
        run: npm test
      - name: Package frontend only (never publish backend or secrets)
        run: |
          set -eu
          test -s index.html
          test -s watchlist-utils.js
          mkdir -p _site
          cp index.html watchlist-utils.js _site/
          touch _site/.nojekyll
          test "$(find _site -type f | wc -l)" -eq 3
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy frontend
        id: deployment
        uses: actions/deploy-pages@v4
